services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecomonitor
      POSTGRES_USER: ecomonitor
      POSTGRES_PASSWORD: ecomonitor_local
    ports:
      - "5432:5432"
    volumes:
      - ecomonitor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecomonitor_pgdata:

